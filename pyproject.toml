[project]
name = "vs-gats-structural-hhi-hoi"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gensim>=4.4.0",
    "h5py>=3.16.0",
    "ipdb>=0.13.13",
    "matplotlib>=3.11.2",
    "numpy>=2.0.0",
    "opencv-python-headless>=5.0.0.93",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm>=4.70.1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pyright]
# Pyright must resolve imports from the uv-managed virtual environment.
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"

[tool.uv.sources]
# Linux (GPU server) gets the cu124 build; other platforms (e.g. macOS) fall
# back to PyPI, where torch ships CPU + MPS builds.
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
